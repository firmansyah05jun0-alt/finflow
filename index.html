<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinFlow">
<meta name="description" content="Catatan keuangan pribadi untuk mahasiswa dan keluarga: pemasukan, pengeluaran, budget, target tabungan, utang-piutang. Bisa dipakai offline.">
<title>FinFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234F46E5'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --card:#FFFFFF; --card2:#F1F4F9; --text:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --pri:#4F46E5; --pri2:#7C3AED; --pri-soft:#EEF2FF; --pri-text:#4338CA;
  --green:#059669; --green-soft:#E7F8F1; --red:#E11D48; --red-soft:#FFF0F3; --amber:#B45309; --amber-soft:#FFF7E6;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
  --radius:18px; --nav-h:70px;
  color-scheme:light;
}
:root[data-ff="light"]{
  --bg:#F3F5FA; --card:#FFFFFF; --card2:#F1F4F9; --text:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --pri:#4F46E5; --pri2:#7C3AED; --pri-soft:#EEF2FF; --pri-text:#4338CA;
  --green:#059669; --green-soft:#E7F8F1; --red:#E11D48; --red-soft:#FFF0F3; --amber:#B45309; --amber-soft:#FFF7E6;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
  --radius:18px; --nav-h:70px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-ff="light"]){
  --bg:#0A0F1E; --card:#131A2D; --card2:#1A2238; --text:#E8EBF7; --muted:#97A2C0; --line:#25304C;
  --pri:#6366F1; --pri2:#8B5CF6; --pri-soft:#1D2150; --pri-text:#A5B4FC;
  --green:#34D399; --green-soft:#0D2A21; --red:#FB7185; --red-soft:#341521; --amber:#FBBF24; --amber-soft:#2E2410;
  --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-ff="light"]){
  --bg:#0A0F1E; --card:#131A2D; --card2:#1A2238; --text:#E8EBF7; --muted:#97A2C0; --line:#25304C;
  --pri:#6366F1; --pri2:#8B5CF6; --pri-soft:#1D2150; --pri-text:#A5B4FC;
  --green:#34D399; --green-soft:#0D2A21; --red:#FB7185; --red-soft:#341521; --amber:#FBBF24; --amber-soft:#2E2410;
  --shadow:none; color-scheme:dark;
}
:root[data-ff="dark"]{
  --bg:#0A0F1E; --card:#131A2D; --card2:#1A2238; --text:#E8EBF7; --muted:#97A2C0; --line:#25304C;
  --pri:#6366F1; --pri2:#8B5CF6; --pri-soft:#1D2150; --pri-text:#A5B4FC;
  --green:#34D399; --green-soft:#0D2A21; --red:#FB7185; --red-soft:#341521; --amber:#FBBF24; --amber-soft:#2E2410;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri-text)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.b{font-weight:700}
.xb{font-weight:800}
.green{color:var(--green)} .red{color:var(--red)} .amber{color:var(--amber)} .pri{color:var(--pri-text)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap-row{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stack>*+*{margin-top:12px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}

/* ---------- layout ---------- */
.wrap{max-width:480px;margin:0 auto;padding:6px 16px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom))}
.top{max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hello{font-size:17px;font-weight:800;letter-spacing:-.01em}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.avatar{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.sync-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--muted);border:2px solid var(--card)}
[data-sync=ok] .sync-dot{background:var(--green)}
[data-sync=pending] .sync-dot{background:var(--amber)}
[data-sync=error] .sync-dot{background:var(--red)}
[data-sync=syncing] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{max-width:480px;margin:4px auto 0;padding:0 16px}
.banner>div{background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.card+.card,.card+.sec,.sec+.card{margin-top:12px}
.sec{margin-top:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
.sec-h h2{font-size:15px;margin:0;font-weight:800}
.sec-h .link{font-size:13px}
.link{color:var(--pri-text);font-weight:700}
.hero{background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 55%,#0D9488 100%);color:#fff;border-radius:24px;padding:18px;box-shadow:0 12px 30px -10px rgba(79,70,229,.55)}
.hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.85;font-weight:700}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px;line-height:1.15;word-break:break-all}
.hero .mini{background:rgba(255,255,255,.14);border-radius:14px;padding:10px}
.hero .mini .t{font-size:12px;opacity:.9;font-weight:600}
.hero .mini .v{font-weight:800;font-size:15px;margin-top:2px}
.hero .foot{margin-top:10px;font-size:12px;opacity:.9;display:flex;justify-content:space-between;gap:8px}

.wallets{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.wallets::-webkit-scrollbar,.scroll::-webkit-scrollbar{display:none}
.wcard{flex:0 0 auto;min-width:128px;max-width:170px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;box-shadow:var(--shadow)}
.wcard .n{font-size:13px;color:var(--muted);font-weight:600}
.wcard .v{font-weight:800;margin-top:4px;font-size:15px}
.wcard.add{display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--pri-text);font-weight:700;font-size:13px;min-width:96px;border-style:dashed;box-shadow:none}

.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);font-weight:700;font-size:13px}
.qa .ic{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.ic-red{background:var(--red-soft);color:var(--red)} .ic-green{background:var(--green-soft);color:var(--green)} .ic-pri{background:var(--pri-soft);color:var(--pri-text)}

/* ---------- inputs ---------- */
.field{display:block}
.field>span,.lbl2{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);font-size:16px;font-weight:600;outline:none;min-height:46px}
.input:focus{border-color:var(--pri);background:var(--card)}
.amount-box{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card2);border-radius:18px;padding:6px 14px}
.amount-box:focus-within{border-color:var(--pri);background:var(--card)}
.amount-box span{font-weight:800;color:var(--muted);font-size:20px}
.amount-box input{flex:1;min-width:0;border:0;background:transparent;font-size:28px;font-weight:800;outline:none;padding:6px 0}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.hint.warn{color:var(--amber);font-weight:700}
.hint.bad{color:var(--red);font-weight:700}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--pri)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;font-weight:800;font-size:15px;background:var(--card2);color:var(--text);border:1px solid var(--line);text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;box-shadow:0 8px 20px -8px rgba(79,70,229,.6)}
.btn.danger{background:var(--red-soft);color:var(--red);border-color:transparent}
.btn.soft{background:var(--pri-soft);color:var(--pri-text);border-color:transparent}
.btn.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:12px}
.btn.block{width:100%}
.btn:active,.qa:active,.wcard:active,.tx:active,.chip:active{transform:scale(.97)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--card2);border-radius:14px;border:1px solid var(--line)}
.seg button{padding:9px 6px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg.t-expense button.on{background:var(--red);color:#fff}
.seg.t-income button.on{background:var(--green);color:#fff}
.seg.t-transfer button.on{background:var(--pri);color:#fff}

/* category grid */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;min-height:72px}
.cat-btn .e{font-size:22px}
.cat-btn.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-text)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-grid button{font-size:22px;padding:6px 0;border-radius:10px;border:1.5px solid transparent}
.emoji-grid button.on{border-color:var(--pri);background:var(--pri-soft)}

/* ---------- lists ---------- */
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-radius:14px}
.tx+.tx{border-top:1px solid var(--line);border-top-left-radius:0;border-top-right-radius:0}
.tx-ic{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px}
.tx-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tx-title{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:800;font-size:14.5px;white-space:nowrap}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);padding:12px 4px 2px}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
.empty .e{font-size:34px;display:block;margin-bottom:6px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.item+.item{margin-top:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--card2);color:var(--muted)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.pri{background:var(--pri-soft);color:var(--pri-text)}
.bar{height:9px;border-radius:99px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar>i.amber{background:#F59E0B}.bar>i.red{background:var(--red)}.bar>i.pri{background:linear-gradient(90deg,var(--pri),var(--pri2))}
.stat{background:var(--card2);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.stat .t{font-size:12px;color:var(--muted);font-weight:700}
.stat .v{font-weight:800;margin-top:2px;font-size:15px;word-break:break-all}

/* period */
.period{margin:6px 0 12px}
.period-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.period-nav b{font-size:14px}
.period-nav button{width:38px;height:34px;border-radius:10px;font-size:20px;font-weight:800;color:var(--pri-text)}
.period-nav .dates{display:flex;gap:6px;flex:1}
.period-nav .dates input{flex:1;min-width:0;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:16px}

/* charts */
.donut-wrap{display:flex;justify-content:center;padding:4px 0}
.donut{width:180px;height:180px}
.d-lbl{font-size:10px;fill:var(--muted);font-weight:700}
.d-val{font-size:17px;fill:var(--text);font-weight:800}
.legend-row{display:flex;align-items:center;gap:10px;padding:8px 4px;width:100%;text-align:left}
.legend-row+.legend-row{border-top:1px solid var(--line)}
.sw{width:12px;height:12px;border-radius:4px;flex:0 0 12px}
.trend{width:100%;height:auto;display:block}
.trend text{font-size:10px;fill:var(--muted);font-weight:700}
.insight{display:flex;gap:10px;padding:10px 4px;font-size:14px}
.insight+.insight{border-top:1px solid var(--line)}
.insight .e{font-size:18px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:480px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--pri-text)}
.nav .fab{width:58px;height:58px;border-radius:20px;margin:-26px auto 0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff!important;font-size:30px;font-weight:600;display:flex!important;align-items:center;justify-content:center;box-shadow:0 12px 24px -8px rgba(79,70,229,.7)}

/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(10,15,30,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet-bg.dialog{align-items:center;padding:16px}
.sheet-bg.dialog .sheet{border-radius:22px;max-width:360px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px}
.sheet-h h3{margin:0;font-size:17px;font-weight:800}
.sheet-b{padding:4px 16px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 16px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.x-btn{width:36px;height:36px;border-radius:12px;background:var(--card2);font-size:18px;font-weight:700;color:var(--muted)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:560px){.sheet-bg{align-items:center;padding:16px}.sheet{border-radius:24px}}

/* toast */
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);z-index:100;max-width:92%;width:420px;background:#0F172A;color:#fff;padding:12px 14px;border-radius:16px;font-size:14px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:#BE123C}.toast.warn{background:#B45309}.toast.success{background:#047857}

/* auth & lock */
.screen{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto}
.auth{max-width:400px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px 30px}
.brand{text-align:center;margin-bottom:16px}
.logo{width:62px;height:62px;border-radius:20px;margin:0 auto 10px;background:linear-gradient(135deg,#4F46E5,#7C3AED 55%,#0D9488);color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px -10px rgba(79,70,229,.7)}
.brand h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.feat div{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.lock{max-width:340px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top)) 20px 30px;text-align:center}
.avatar.big{width:72px;height:72px;border-radius:24px;font-size:30px;margin:0 auto 12px}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0 26px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--pri);border-color:var(--pri)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keypad button{height:62px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:700;box-shadow:var(--shadow)}
.keypad button.ok{background:var(--pri);color:#fff;border:0}

/* privacy */
.hide-money .mv{filter:blur(7px);user-select:none}
.receipt-img{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
details.guide{background:var(--card2);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
details.guide summary{font-weight:700;cursor:pointer}

<script>
'use strict';
/* =====================================================================
   FinFlow v6 — Catatan Keuangan Pribadi
   Ubah bagian APP di bawah ini untuk branding / kontak penjual.
   ===================================================================== */
const APP = {
  name: 'FinFlow',
  version: '6.2.0',
  tagline: 'Catatan keuangan pribadi — mahasiswa & keluarga',
  contact: '',          // contoh: 'WA 0812-xxxx-xxxx' atau email, tampil di Pengaturan > Tentang
  backupRemindDays: 14, // ingatkan backup jika belum backup sekian hari (mode offline)
  /* ---- Premium (opsional) ----
     licenseUrl kosong  = semua fitur terbuka (tanpa sistem Premium).
     licenseUrl diisi   = versi gratis dibatasi; buka Premium dengan kode dari FinFlow_Lisensi.gs */
  licenseUrl: '',       // URL /exec server lisensi milik penjual
  buyUrl: '',           // link halaman beli, mis. https://lynk.id/namamu/finflow atau https://wa.me/62812xxxx
  priceLabel: 'Rp 29.000 · sekali bayar',
  privacyUrl: 'kebijakan-privasi.html',
  preview: false        // true hanya untuk versi link demo (unduh & sinkron dimatikan)
};
const LIB = {
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  autotable: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
};
const STORAGE_OK = (() => { try { localStorage.setItem('ff6_probe', '1'); localStorage.removeItem('ff6_probe'); return true; } catch (e) { return false; } })();
const IS_GAS = typeof google !== 'undefined' && !!(google.script && google.script.run);
const COLS = ['wallets', 'categories', 'txs', 'budgets', 'goals', 'debts', 'recurring', 'prefs'];

/* ---------------- penyimpanan aman ---------------- */
const memStore = {};
let storageWarned = false;
const LS = {
  get(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return k in memStore ? memStore[k] : null; },
  set(k, v) {
    try { localStorage.setItem(k, v); delete memStore[k]; return true; }
    catch (e) {
      memStore[k] = v;
      if (!storageWarned) { storageWarned = true; toast('Penyimpanan HP penuh atau diblokir browser. Data hanya tersimpan sementara — segera buat Backup!', 'error', 7000); }
      return false;
    }
  },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} delete memStore[k]; },
  getJSON(k, d) { const v = LS.get(k); if (!v) return d; try { return JSON.parse(v); } catch (e) { return d; } },
  setJSON(k, o) { return LS.set(k, JSON.stringify(o)); }
};
function getGlobal() { return LS.getJSON('ff6_global', {}) || {}; }
function setGlobal(patch) { const g = Object.assign(getGlobal(), patch); LS.setJSON('ff6_global', g); return g; }
function getUsers() { return LS.getJSON('ff6_users', {}) || {}; }
function saveUsers(m) { LS.setJSON('ff6_users', m); }

/* foto struk di IndexedDB (bukan localStorage yang cuma ~5 MB) */
const Receipts = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('finflow_files', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('receipts');
        r.onsuccess = () => { this._db = r.result; res(this._db); };
        r.onerror = () => rej(r.error || new Error('IndexedDB gagal'));
      } catch (e) { rej(e); }
    });
  },
  async _tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('receipts', mode); const st = t.objectStore('receipts');
      let out; const req = fn(st); if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('dibatalkan'));
    });
  },
  key(txId, u) { return (u || (S.user && S.user.username)) + ':' + txId; },
  put(txId, data, u) { return this._tx('readwrite', st => st.put(data, this.key(txId, u))); },
  get(txId, u) { return this._tx('readonly', st => st.get(this.key(txId, u))); },
  del(txId, u) { return this._tx('readwrite', st => st.delete(this.key(txId, u))).catch(() => {}); },
  async delUser(u) {
    try { const keys = await this._tx('readonly', st => st.getAllKeys());
      const mine = (keys || []).filter(k => String(k).indexOf(u + ':') === 0);
      if (mine.length) await this._tx('readwrite', st => { mine.forEach(k => st.delete(k)); return null; });
    } catch (e) {}
  }
};

/* ---------------- utilitas ---------------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtNum(n) { return Math.round(Math.abs(Number(n) || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function rp(n) { const v = Math.round(Number(n) || 0); return (v < 0 ? '-Rp ' : 'Rp ') + fmtNum(v); }
function mv(n, sign) { const v = Math.round(Number(n) || 0); return '<span class="mv">' + (sign || '') + (sign ? 'Rp ' + fmtNum(v) : rp(v)) + '</span>'; }
function trim1(x) { return (Math.round(x * 10) / 10).toString().replace('.', ','); }
function short(n) { const a = Math.abs(n), s = n < 0 ? '-' : ''; if (a >= 1e9) return s + trim1(a / 1e9) + 'M'; if (a >= 1e6) return s + trim1(a / 1e6) + 'jt'; if (a >= 1e3) return s + trim1(a / 1e3) + 'rb'; return s + Math.round(a); }
function parseAmount(s) { const d = String(s == null ? '' : s).replace(/[^0-9]/g, ''); return d ? Math.min(parseInt(d, 10), 999999999999) : 0; }
function uid(p) { return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function normUser(s) { return String(s || '').toLowerCase().trim().replace(/[^a-z0-9_]/g, ''); }
function stripEmoji(s) { try { return String(s || '').replace(/[\p{Extended_Pictographic}‍️]/gu, '').trim(); } catch (e) { return String(s || ''); } }
function sum(arr, f) { let t = 0; for (const x of arr) t += f ? f(x) : x; return t; }

/* SHA-256 murni JS (tetap jalan walau crypto.subtle tidak tersedia, mis. dibuka dari file://) */
const SHA_K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256Hex(str) {
  const bytes = new TextEncoder().encode(String(str));
  const l = bytes.length, total = ((l + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total); buf.set(bytes); buf[l] = 0x80;
  const dv = new DataView(buf.buffer); const bits = l * 8;
  dv.setUint32(total - 4, bits >>> 0); dv.setUint32(total - 8, Math.floor(bits / 4294967296));
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const W = new Uint32Array(64);
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = W[i - 15], b = W[i - 2];
      const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
      const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
    }
    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const t1 = (h + S1 + ((e & f) ^ (~e & g)) + SHA_K[i] + W[i]) >>> 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}
function stretch(s, rounds) { let h = sha256Hex(s); for (let i = 1; i < rounds; i++) h = sha256Hex(h + s); return h; }
function randHex(n) {
  const a = new Uint8Array(n);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); }
  return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
}
function pinHash(salt, pin) { return stretch(salt + ':' + pin, 1500); }
function authToken(u, pin) { return stretch(u + ':' + pin + ':finflow-sync-v6', 1500); }

/* ---------------- tanggal (selalu waktu lokal HP) ---------------- */
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseYmd(s) { const p = String(s || '').split('-').map(Number); return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1); }
function today() { return ymd(new Date()); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function dayDiff(a, b) { const A = parseYmd(a), B = parseYmd(b); return Math.round((Date.UTC(B.getFullYear(), B.getMonth(), B.getDate()) - Date.UTC(A.getFullYear(), A.getMonth(), A.getDate())) / 864e5); }
function isYmd(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && ymd(parseYmd(s)) === s; }
function fmtDate(s, withDay) { if (!s) return ''; const d = parseYmd(s); return (withDay ? HARI[d.getDay()] + ', ' : '') + d.getDate() + ' ' + BLN[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtDateShort(s) { const d = parseYmd(s); return d.getDate() + ' ' + BLN[d.getMonth()]; }
function relDay(s) { const n = dayDiff(today(), s); if (n === 0) return 'Hari ini'; if (n === -1) return 'Kemarin'; if (n === 1) return 'Besok'; return fmtDate(s, true); }
function addMonthsClamp(s, n, anchorDay) {
  const d = parseYmd(s); const day = anchorDay || d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(day, last)); return ymd(t);
}
function fmtTime(ts) { if (!ts) return '-'; const d = new Date(ts); return fmtDate(ymd(d)) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

/* ---------------- state & data ---------------- */
const S = {
  user: null, db: null, tab: 'home', authMode: 'login',
  ui: { period: { kind: 'month', offset: 0 }, cStart: '', cEnd: '', plan: 'budget', statsType: 'expense', debtFilter: 'active',
        hist: { q: '', type: 'all', cat: '', wallet: '', limit: 120 } }
};
function emptyDb() { const d = { meta: {} }; COLS.forEach(c => { d[c] = []; }); return d; }
function dbKey(u) { return 'ff6_db_' + u; }
function loadDb(u) {
  const d = LS.getJSON(dbKey(u), null) || emptyDb();
  COLS.forEach(c => { if (!Array.isArray(d[c])) d[c] = []; });
  if (!d.meta || typeof d.meta !== 'object') d.meta = {};
  return d;
}
function saveDb() { if (S.user && S.db) LS.setJSON(dbKey(S.user.username), S.db); }
function nowTs() { return Date.now() + ((S.db && S.db.meta.clockOffset) || 0); }
function all(col) { return S.db[col].filter(r => !r.deleted); }
function byId(col, id) { if (!id) return null; return S.db[col].find(r => r.id === id) || null; }
function live(col, id) { const r = byId(col, id); return r && !r.deleted ? r : null; }
function put(col, rec) {
  const list = S.db[col]; const i = list.findIndex(r => r.id === rec.id); const ts = nowTs();
  const out = Object.assign({}, i >= 0 ? list[i] : { createdAt: ts }, rec, { updatedAt: ts });
  if (!('deleted' in rec)) delete out.deleted;
  if (i >= 0) list[i] = out; else list.push(out);
  return out;
}
function del(col, id) { const r = byId(col, id); if (r && !r.deleted) { r.deleted = true; r.updatedAt = nowTs(); } }
function commit(opts) { saveDb(); scheduleSync(); if (!opts || !opts.noRender) renderAll(); }

const DEFAULT_WALLETS = [
  { id: 'w_tunai', name: 'Tunai', icon: '💵', kind: 'cash' },
  { id: 'w_bank', name: 'Bank', icon: '🏦', kind: 'bank' },
  { id: 'w_ewallet', name: 'E-Wallet', icon: '📱', kind: 'ewallet' }
];
const DEFAULT_CATS = [
  ['e_makan', 'expense', '🍜', 'Makan & Minum'], ['e_transport', 'expense', '🛵', 'Transportasi'], ['e_belanja', 'expense', '🛍️', 'Belanja'],
  ['e_tagihan', 'expense', '📶', 'Tagihan & Kuota'], ['e_kuliah', 'expense', '🎓', 'Kuliah / Kerja'], ['e_kos', 'expense', '🏠', 'Kos / Rumah'],
  ['e_hiburan', 'expense', '🎮', 'Hiburan'], ['e_kesehatan', 'expense', '💊', 'Kesehatan'], ['e_sosial', 'expense', '🎁', 'Sosial & Donasi'],
  ['e_admin', 'expense', '🧾', 'Biaya Admin'], ['e_lain', 'expense', '📦', 'Lainnya'],
  ['i_gaji', 'income', '💼', 'Gaji / Upah'], ['i_proyek', 'income', '💻', 'Proyek / Freelance'], ['i_saku', 'income', '🎒', 'Uang Saku / Beasiswa'],
  ['i_bonus', 'income', '🎉', 'Bonus / THR'], ['i_jual', 'income', '🏷️', 'Penjualan'], ['i_invest', 'income', '📈', 'Investasi'], ['i_lain', 'income', '📦', 'Lainnya']
];
const PROTECTED_CATS = ['e_lain', 'i_lain'];
/* default dibuat dengan updatedAt=1 supaya perubahan asli dari HP lain selalu menang saat sinkron */
function seedDefaults(db) {
  db = db || S.db;
  DEFAULT_WALLETS.forEach((w, i) => { if (!db.wallets.find(x => x.id === w.id)) db.wallets.push(Object.assign({ initial: 0, order: i, createdAt: 1, updatedAt: 1 }, w)); });
  DEFAULT_CATS.forEach((c, i) => { if (!db.categories.find(x => x.id === c[0])) db.categories.push({ id: c[0], type: c[1], icon: c[2], name: c[3], order: i, createdAt: 1, updatedAt: 1 }); });
  if (!db.prefs.find(x => x.id === 'profile')) db.prefs.push({ id: 'profile', displayName: (S.user && S.user.displayName) || '', monthStartDay: 1, createdAt: 1, updatedAt: 1 });
}
function prefs() { return live('prefs', 'profile') || { monthStartDay: 1, displayName: '' }; }
function displayName() { return prefs().displayName || (S.user && (S.user.displayName || S.user.username)) || ''; }
function cat(id) { return byId('categories', id) || { id: id, name: 'Tanpa kategori', icon: '❔', type: 'expense' }; }
function wal(id) { return byId('wallets', id) || { id: id, name: 'Dompet terhapus', icon: '👛' }; }
function cats(type) { return all('categories').filter(c => c.type === type).sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name)); }
function wallets(includeArchived) { return all('wallets').filter(w => includeArchived || !w.archived).sort((a, b) => (a.order || 0) - (b.order || 0)); }
function adminCatId() { return live('categories', 'e_admin') ? 'e_admin' : 'e_lain'; }

/* ---------------- perhitungan ---------------- */
function walletEffects(t) {
  const a = Number(t.amount) || 0;
  switch (t.type) {
    case 'expense': return t.walletId ? [[t.walletId, -a]] : [];
    case 'income': return t.walletId ? [[t.walletId, a]] : [];
    case 'transfer': return [[t.walletId, -a], [t.toWalletId, a]];
    case 'saving': return t.walletId ? [[t.walletId, -a]] : [];
    case 'debt': { const sign = (t.role === 'principal') === (t.kind === 'hutang') ? 1 : -1; return t.walletId ? [[t.walletId, sign * a]] : []; }
  }
  return [];
}
function balances() {
  const m = {};
  S.db.wallets.forEach(w => { if (!w.deleted) m[w.id] = Number(w.initial) || 0; });
  for (const t of S.db.txs) { if (t.deleted) continue; for (const [w, d] of walletEffects(t)) { if (w in m) m[w] += d; } }
  return m;
}
function totalBalance(b) { b = b || balances(); return sum(Object.keys(b), k => b[k]); }
function inRange(t, r) { return t.date >= r.start && t.date <= r.end; }
function summarize(r) {
  const o = { inc: 0, exp: 0, n: 0, byExp: {}, byInc: {}, list: [] };
  for (const t of S.db.txs) {
    if (t.deleted || !inRange(t, r)) continue;
    o.n++; o.list.push(t);
    const a = Number(t.amount) || 0;
    if (t.type === 'income') { o.inc += a; o.byInc[t.categoryId] = (o.byInc[t.categoryId] || 0) + a; }
    else if (t.type === 'expense') { o.exp += a; o.byExp[t.categoryId] = (o.byExp[t.categoryId] || 0) + a; }
  }
  return o;
}
function sortTx(list) { return list.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0))); }
function spentIn(catId, r) {
  let s = 0;
  for (const t of S.db.txs) { if (t.deleted || t.type !== 'expense' || !inRange(t, r)) continue; if (catId === '__all' || t.categoryId === catId) s += Number(t.amount) || 0; }
  return s;
}
function goalCollected(gid) { return sum(S.db.txs.filter(t => !t.deleted && t.type === 'saving' && t.goalId === gid), t => Number(t.amount) || 0); }
function debtPaid(did) { return sum(S.db.txs.filter(t => !t.deleted && t.type === 'debt' && t.debtId === did && t.role === 'payment'), t => Number(t.amount) || 0); }
function debtInfo(d) { const paid = debtPaid(d.id); const remain = Math.max(0, (Number(d.amount) || 0) - paid); return { paid, remain, done: remain <= 0 }; }

/* ---------------- periode ---------------- */
function monthRange(offset, base) {
  const sd = Math.min(28, Math.max(1, Number(prefs().monthStartDay) || 1));
  const b = parseYmd(base || today());
  let y = b.getFullYear(), m = b.getMonth();
  if (b.getDate() < sd) m -= 1;
  m += offset || 0;
  const start = new Date(y, m, sd), end = new Date(y, m + 1, sd - 1);
  const label = sd === 1 ? BULAN[start.getMonth()] + ' ' + start.getFullYear()
    : start.getDate() + ' ' + BLN[start.getMonth()] + ' – ' + end.getDate() + ' ' + BLN[end.getMonth()] + ' ' + end.getFullYear();
  return { start: ymd(start), end: ymd(end), label: label, shortLabel: BLN[start.getMonth()] + (sd === 1 ? '' : '*') };
}
function periodRange(p) {
  p = p || S.ui.period; const t = today(); const off = p.offset || 0;
  if (p.kind === 'today') { const d = addDays(t, off); return { start: d, end: d, label: relDay(d) }; }
  if (p.kind === 'week') {
    const dow = parseYmd(t).getDay(); const s = addDays(t, -((dow + 6) % 7) + 7 * off); const e = addDays(s, 6);
    return { start: s, end: e, label: (off === 0 ? 'Minggu ini · ' : '') + fmtDateShort(s) + ' – ' + fmtDateShort(e) };
  }
  if (p.kind === 'month') { const r = monthRange(off); if (off === 0) r.label = r.label + ' (bulan ini)'; return r; }
  if (p.kind === 'year') { const y = parseYmd(t).getFullYear() + off; return { start: y + '-01-01', end: y + '-12-31', label: 'Tahun ' + y }; }
  if (p.kind === 'custom') {
    let s = S.ui.cStart || monthRange(0).start, e = S.ui.cEnd || t; if (s > e) { const x = s; s = e; e = x; }
    return { start: s, end: e, label: fmtDate(s) + ' – ' + fmtDate(e) };
  }
  return { start: '0000-01-01', end: '9999-12-31', label: 'Semua waktu' };
}
function previousRange(p) {
  p = p || S.ui.period;
  if (['today', 'week', 'month', 'year'].indexOf(p.kind) >= 0) return periodRange({ kind: p.kind, offset: (p.offset || 0) - 1 });
  if (p.kind === 'custom') { const r = periodRange(p); const n = dayDiff(r.start, r.end) + 1; return { start: addDays(r.start, -n), end: addDays(r.start, -1) }; }
  return null;
}
function budgetMonth() { return S.ui.period.kind === 'month' ? monthRange(S.ui.period.offset || 0) : monthRange(0); }

/* ---------------- toast ---------------- */
let toastTimer = null;
function toast(msg, type, ms) {
  const el = $('#toast'); if (!el) return;
  el.textContent = msg; el.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.className = 'toast ' + (type || ''); }, ms || 3000);
}

/* ---------------- sheet / modal (tombol Back HP ikut menutup) ---------------- */
const SHEETS = []; let popIgnore = 0, backTimer = null;
/* Satu entri riwayat untuk semua sheet yang terbuka: tombol Back HP menutup sheet teratas,
   dan menutup sheet lewat tombol tidak pernah membuat browser keluar dari aplikasi.
   history.state dipakai sebagai patokan supaya tetap benar walau buka/tutup terjadi beruntun. */
function onSheetEntry() { try { return !!(history.state && history.state.ffSheet); } catch (e) { return false; } }
function armHistory() {
  if (APP.preview) return;
  if (backTimer) { clearTimeout(backTimer); backTimer = null; }
  if (!onSheetEntry()) { try { history.pushState({ ffSheet: 1 }, ''); } catch (e) {} }
}
function releaseHistory() {
  if (APP.preview || backTimer) return;
  backTimer = setTimeout(() => { backTimer = null; if (SHEETS.length || !onSheetEntry()) return; popIgnore++; try { history.back(); } catch (e) { popIgnore--; } }, 0);
}
function openSheet(o) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg' + (o.dialog ? ' dialog' : '');
  bg.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h3></h3><button type="button" class="x-btn" aria-label="Tutup">✕</button></div><div class="sheet-b"></div><div class="sheet-f hidden"></div></div>';
  $('h3', bg).textContent = o.title || '';
  $('.sheet-b', bg).innerHTML = o.body || '';
  if (o.foot) { const f = $('.sheet-f', bg); f.innerHTML = o.foot; f.classList.remove('hidden'); }
  const entry = { el: bg, o: o };
  bg.addEventListener('mousedown', e => { entry.downOnBg = e.target === bg; });
  bg.addEventListener('click', e => { if (e.target === bg && entry.downOnBg && !o.sticky) closeSheet(); });
  $('.x-btn', bg).addEventListener('click', () => closeSheet());
  $('#sheets').appendChild(bg); SHEETS.push(entry);
  document.body.style.overflow = 'hidden';
  armHistory();
  if (o.onMount) o.onMount(bg, entry);
  if (o.focus) { const f = $(o.focus, bg); if (f) setTimeout(() => f.focus(), 60); }
  return entry;
}
function topSheet() { return SHEETS[SHEETS.length - 1] || null; }
function closeSheet(fromPop) {
  const s = SHEETS.pop(); if (!s) return;
  s.el.remove();
  if (!SHEETS.length) document.body.style.overflow = '';
  if (!SHEETS.length && !fromPop) releaseHistory();
  if (s.o.onClose) s.o.onClose();
}
function closeAllSheets() { while (SHEETS.length) closeSheet(); }
window.addEventListener('popstate', () => {
  if (popIgnore > 0) { popIgnore--; if (SHEETS.length && !onSheetEntry()) armHistory(); return; }
  if (SHEETS.length) { closeSheet(true); if (SHEETS.length) armHistory(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SHEETS.length) closeSheet(); });
function setSheetBody(entry, html) { $('.sheet-b', entry.el).innerHTML = html; }
function setSheetFoot(entry, html) { const f = $('.sheet-f', entry.el); f.innerHTML = html; f.classList.toggle('hidden', !html); }

function confirmBox(title, text, okText, danger) {
  return new Promise(resolve => {
    let done = false;
    const s = openSheet({
      title: title, dialog: true,
      body: '<p class="muted" style="margin:0">' + esc(text) + '</p>',
      foot: '<button type="button" class="btn" data-x="no">Batal</button><button type="button" class="btn ' + (danger ? 'danger' : 'pri') + '" data-x="yes">' + esc(okText || 'Ya, lanjutkan') + '</button>',
      onClose: () => { if (!done) { done = true; resolve(false); } }
    });
    $$('[data-x]', s.el).forEach(b => b.addEventListener('click', () => { const ok = b.dataset.x === 'yes'; done = true; closeSheet(); resolve(ok); }));
  });
}
function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.old = btn.innerHTML; btn.disabled = true; btn.innerHTML = label || 'Memproses…'; }
  else { btn.disabled = false; if (btn.dataset.old) btn.innerHTML = btn.dataset.old; }
}
function loadScript(url) {
  loadScript.cache = loadScript.cache || {};
  if (loadScript.cache[url]) return loadScript.cache[url];
  const p = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = url; s.async = true;
    const t = setTimeout(() => rej(new Error('timeout')), 15000);
    s.onload = () => { clearTimeout(t); res(); }; s.onerror = () => { clearTimeout(t); delete loadScript.cache[url]; s.remove(); rej(new Error('gagal memuat')); };
    document.head.appendChild(s);
  });
  loadScript.cache[url] = p; p.catch(() => { delete loadScript.cache[url]; });
  return p;
}
function previewBlocked() { if (!APP.preview) return false; toast('Di link demo, unduh file (backup/PDF/Excel/CSV) dimatikan. Di aplikasi lengkap tombol ini langsung mengunduh file.', 'warn', 5000); return true; }
function downloadBlob(blob, name) {
  const a = document.createElement('a'); const url = URL.createObjectURL(blob);
  a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}

function applyTheme() {
  const g = getGlobal(); const pref = g.theme || 'auto'; const root = document.documentElement;
  if (pref === 'light' || pref === 'dark') root.dataset.ff = pref; else delete root.dataset.ff;
  let dark = pref === 'dark';
  if (pref === 'auto') { const host = root.getAttribute('data-theme'); if (host === 'dark' || host === 'light') dark = host === 'dark'; else { try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {} } }
  const m = $('meta[name=theme-color]'); if (m) m.setAttribute('content', dark ? '#0A0F1E' : '#4F46E5');
  document.body.classList.toggle('hide-money', !!g.hideMoney);
}
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}

function createLocalUser(u, name, pin, extra) {
  const users = getUsers(); const salt = randHex(16);
  users[u] = Object.assign({ username: u, displayName: name || u, salt: salt, pinHash: pinHash(salt, pin), pinLen: String(pin).length,
    pinNumeric: /^\d+$/.test(pin), auth: authToken(u, pin), createdAt: Date.now(), lockOnOpen: true }, extra || {});
  saveUsers(users); return users[u];
}
function updateLocalUser(u, patch) { const users = getUsers(); if (!users[u]) return null; Object.assign(users[u], patch); saveUsers(users); if (S.user && S.user.username === u) S.user = users[u]; return users[u]; }
function failState(u) { return (LS.getJSON('ff6_fail', {}) || {})[u] || { n: 0, until: 0 }; }
function recordFail(u, reset) {
  const m = LS.getJSON('ff6_fail', {}) || {};
  if (reset) { delete m[u]; LS.setJSON('ff6_fail', m); return 0; }
  const f = m[u] || { n: 0, until: 0 }; f.n++;
  if (f.n >= 5) f.until = Date.now() + Math.min(15 * 60, 30 * Math.pow(2, f.n - 5)) * 1000;
  m[u] = f; LS.setJSON('ff6_fail', m); return f.n;
}
function lockedFor(u) { const f = failState(u); const s = Math.ceil((f.until - Date.now()) / 1000); return s > 0 ? s : 0; }

function formErr(form, msg) { const e = form && $('.form-err', form); if (e) e.textContent = msg; toast(msg, 'error', 4500); }
async function doLogin(form) {
  const u = normUser(form.elements.namedItem('username').value); const pin = form.elements.namedItem('pin').value.trim();
  if (!u || !pin) return formErr(form, 'Isi username dan PIN');
  const wait = lockedFor(u); if (wait) return formErr(form, 'Terlalu banyak percobaan. Coba lagi dalam ' + wait + ' detik.');
  const btn = $('button[type=submit]', form); const users = getUsers(); const rec = users[u];
  if (rec) {
    if (pinHash(rec.salt, pin) === rec.pinHash) { recordFail(u, true); return startSession(u); }
    if (serverOn() && u !== 'demo') {
      /* PIN mungkin sudah diganti dari HP lain: cek ke server */
      busy(btn, true);
      try {
        const res = await callServer({ action: 'login', username: u, auth: authToken(u, pin) });
        if (res && res.success) { const salt = randHex(16); updateLocalUser(u, { salt: salt, pinHash: pinHash(salt, pin), pinLen: pin.length, pinNumeric: /^\d+$/.test(pin), auth: authToken(u, pin) }); recordFail(u, true); busy(btn, false); return startSession(u); }
      } catch (e) {} finally { busy(btn, false); }
    }
    const n = recordFail(u); form.elements.namedItem('pin').value = ''; return formErr(form, 'PIN salah' + (n >= 3 ? ' (' + n + 'x)' : ''));
  }
  if (!serverOn()) return formErr(form, 'Akun @' + u + ' belum ada di HP ini. Pilih "Daftar Baru", atau aktifkan Sinkron untuk masuk dari server.');
  busy(btn, true);
  try {
    const res = await callServer({ action: 'login', username: u, auth: authToken(u, pin) });
    if (!res || !res.success) { recordFail(u); return formErr(form, (res && res.message) || 'Login gagal'); }
    recordFail(u, true);
    createLocalUser(u, res.displayName || u, pin);
    await startSession(u, { fresh: true });
  } catch (e) { formErr(form, 'Tidak bisa terhubung ke server. Cek internet / URL sinkron.'); }
  finally { busy(btn, false); }
}
async function doRegister(form) {
  const el = n => form.elements.namedItem(n); const name = el('dname').value.trim(); const u = normUser(el('username').value); const pin = el('pin').value.trim(); const pin2 = el('pin2').value.trim();
  if (!name) return formErr(form, 'Isi nama panggilan');
  if (u.length < 3 || u.length > 20) return formErr(form, 'Username 3–20 karakter (huruf kecil, angka, _)');
  if (u === 'demo') return formErr(form, 'Username "demo" khusus mode demo');
  if (!/^\d{4,8}$/.test(pin)) return formErr(form, 'PIN harus 4–8 angka');
  if (pin !== pin2) return formErr(form, 'Ulangi PIN tidak sama');
  if (/^(\d)\1+$/.test(pin) || '0123456789'.indexOf(pin) >= 0) toast('Tips: hindari PIN mudah ditebak seperti 1111 / 1234', 'warn');
  if (getUsers()[u]) return formErr(form, 'Username @' + u + ' sudah ada di HP ini. Pilih "Masuk".');
  const btn = $('button[type=submit]', form);
  if (serverOn()) {
    busy(btn, true);
    try {
      const res = await callServer({ action: 'register', username: u, auth: authToken(u, pin), displayName: name });
      if (!res || !res.success) { busy(btn, false); return formErr(form, (res && res.message) || 'Gagal daftar ke server'); }
    } catch (e) { busy(btn, false); return formErr(form, 'Tidak bisa terhubung ke server sinkron. Cek internet, atau ganti ke Mode Offline.'); }
    busy(btn, false);
  }
  createLocalUser(u, name, pin);
  await startSession(u, { newUser: true, displayName: name, demo: el('demo').checked });
}

async function wipeLocalUser(u) {
  if (!(await confirmBox('Hapus akun dari HP?', 'Semua data @' + u + ' di HP ini akan dihapus permanen. Data di server sinkron (jika ada) tidak ikut terhapus.', 'Hapus permanen', true))) return;

}

function drawLockDots() { const rec = getUsers()[lockUser]; const n = rec ? rec.pinLen : 4; const d = $('#lockDots'); if (d) d.innerHTML = Array.from({ length: n }, (_, i) => '<i class="' + (i < lockBuf.length ? 'f' : '') + '"></i>').join(''); }
function lockKey(k) {
  const rec = getUsers()[lockUser]; if (!rec) return;
  if (k === 'del') lockBuf = lockBuf.slice(0, -1);
  else if (k === 'ok') return tryUnlock();
  else if (lockBuf.length < 8) lockBuf += k;
  drawLockDots();
  if (lockBuf.length === rec.pinLen) setTimeout(tryUnlock, 80);
}
function tryUnlock() {
  const u = lockUser; const rec = getUsers()[u]; if (!rec || !lockBuf) return;
  const wait = lockedFor(u); if (wait) { lockBuf = ''; drawLockDots(); return toast('Terlalu banyak percobaan. Tunggu ' + wait + ' detik.', 'error'); }
  if (pinHash(rec.salt, lockBuf) === rec.pinHash) { recordFail(u, true); lockBuf = ''; startSession(u); return; }
  const n = recordFail(u); lockBuf = '';
  const d = $('#lockDots'); if (d) { d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
  drawLockDots(); toast('PIN salah' + (n >= 3 ? ' (' + n + 'x percobaan)' : ''), 'error');
}
document.addEventListener('keydown', e => {
  if ($('#lockScreen').classList.contains('hidden')) return;
  if (/^\d$/.test(e.key)) lockKey(e.key); else if (e.key === 'Backspace') lockKey('del'); else if (e.key === 'Enter') lockKey('ok');
});

async function startSession(u, opts) {
  opts = opts || {};
  const users = getUsers(); S.user = users[u]; if (!S.user) return showAuth('login');
  S.db = loadDb(u); LS.set('ff6_session', u);
  S.tab = 'home'; S.ui.period = { kind: 'month', offset: 0 };

    seedDefaults(); put('prefs', { id: 'profile', displayName: opts.displayName || S.user.displayName, monthStartDay: 1 });
    if (opts.demo) seedDemo(); else S.db.meta.needOnboard = true;
    saveDb();
  }

  if (opts.fresh) { renderAll(); toast('Mengambil data dari server…'); await syncNow(false); }

}

document.addEventListener('visibilitychange', () => {

/* ---------------- migrasi data versi lama (v5) ---------------- */
function migrateLegacy() {
  if (LS.get('ff6_migrated')) return;
  const legacy = LS.getJSON('finflow_multi_users', null);
  if (!legacy || typeof legacy !== 'object') { LS.set('ff6_migrated', '1'); return; }
  const users = getUsers(); const done = [];
  const CMAP = { expense: { 'Makan & Minum': 'e_makan', 'Transportasi': 'e_transport', 'Belanja': 'e_belanja', 'Tagihan & Kuota': 'e_tagihan', 'Kebutuhan Kuliah/Kerja': 'e_kuliah', 'Kos / Rumah': 'e_kos', 'Hiburan': 'e_hiburan', 'Kesehatan': 'e_kesehatan', 'Lainnya': 'e_lain' },
    income: { 'Gaji / Upah': 'i_gaji', 'Proyek / Freelance': 'i_proyek', 'Uang Saku / Beasiswa': 'i_saku', 'Bonus': 'i_bonus', 'Investasi': 'i_invest', 'Lainnya': 'i_lain' } };
  const WMAP = { 'Tunai': 'w_tunai', 'Bank': 'w_bank', 'E-Wallet': 'w_ewallet' };
  Object.keys(legacy).forEach(key => {
    try {
      const lu = legacy[key] || {}; const u = normUser(lu.username || key); if (!u || users[u] || u === 'demo') return;
      const pin = String(lu.password || '1234');
      const rec = createLocalUser(u, lu.displayName || u, pin); if (!rec.pinNumeric) updateLocalUser(u, { lockOnOpen: false });
      const db = emptyDb(); seedDefaults(db); const ts = Date.now();
      db.prefs = [{ id: 'profile', displayName: lu.displayName || u, monthStartDay: 1, createdAt: ts, updatedAt: ts }];
      const mk = (o) => Object.assign({ createdAt: ts, updatedAt: ts }, o);
      const catId = (type, name) => {
        const m = CMAP[type][name]; if (m) return m;
        const ex = db.categories.find(c => c.type === type && c.name === name); if (ex) return ex.id;
        const id = uid('c'); db.categories.push(mk({ id: id, type: type, icon: '🏷️', name: String(name || 'Lainnya').slice(0, 30), order: 99 })); return id;
      };
      const txs = LS.getJSON('finflow_txs_' + key, []) || [];
      txs.forEach(x => {
        if (!x || !x.id || String(x.id).indexOf('tf_in_') === 0) return;
        const w = WMAP[x.wallet] || 'w_tunai'; const date = isYmd(x.date) ? x.date : today();
        if (String(x.id).indexOf('tf_out_') === 0) {
          const m = /ke\s+(.+)$/i.exec(x.note || ''); const to = WMAP[m ? m[1].trim() : ''] || 'w_ewallet';
          db.txs.push(mk({ id: 't' + x.id, type: 'transfer', amount: Number(x.amount) || 0, walletId: w, toWalletId: to, date: date, note: '' })); return;
        }
        const type = x.type === 'income' ? 'income' : 'expense';
        const t = mk({ id: 't' + x.id, type: type, amount: Number(x.amount) || 0, categoryId: catId(type, x.category), walletId: w, date: date, note: String(x.note || '').slice(0, 120) });
        if (x.receiptUrl && String(x.receiptUrl).indexOf('data:image') === 0) { t.hasReceipt = true; Receipts.put(t.id, x.receiptUrl, u).catch(() => { t.hasReceipt = false; }); }
        db.txs.push(t);
      });
      const bud = LS.getJSON('finflow_budgets_' + key, {}) || {};
      Object.keys(bud).forEach(name => { const cid = catId('expense', name); if (Number(bud[name]) > 0) db.budgets.push(mk({ id: 'b_' + cid, categoryId: cid, limit: Number(bud[name]) })); });
      (LS.getJSON('finflow_debts_' + key, []) || []).forEach(d => {
        if (!d || !d.id) return; const id = 'd' + d.id; const kind = d.type === 'hutang' ? 'hutang' : 'piutang';
        db.debts.push(mk({ id: id, kind: kind, contact: d.contact || '-', phone: '', amount: Number(d.amount) || 0, date: isYmd(d.date) ? d.date : today(), dueDate: '', note: d.note || '' }));
        if (d.status === 'lunas') db.txs.push(mk({ id: id + '_lunas', type: 'debt', role: 'payment', kind: kind, debtId: id, walletId: '', amount: Number(d.amount) || 0, date: today(), note: 'Lunas (dari versi lama)' }));
      });
      (LS.getJSON('finflow_goals_' + key, []) || []).forEach(g => {
        if (!g || !g.id) return; const id = 'g' + g.id;
        db.goals.push(mk({ id: id, title: g.title || 'Target', icon: '🎯', target: Number(g.target) || 0, deadline: isYmd(g.deadline) ? g.deadline : '' }));
        if (Number(g.collected) > 0) db.txs.push(mk({ id: id + '_awal', type: 'saving', goalId: id, walletId: '', amount: Number(g.collected), date: today(), note: 'Saldo awal (dari versi lama)' }));
      });
      LS.setJSON(dbKey(u), db); done.push('@' + u + (pin === '1234' ? ' (PIN 1234)' : ''));
    } catch (e) { console.warn('migrasi gagal', key, e); }
  });
  LS.del('finflow_multi_users'); LS.del('finflow_active_user'); LS.set('ff6_migrated', '1');
  if (done.length) S.migrationNote = 'Data versi lama sudah dipindahkan: ' + done.join(', ') + '. Masuk memakai PIN lama, lalu segera ganti PIN di Pengaturan.';
}

function seedDemo() {
  let seed = 20261103; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)]; const r1k = (a, b) => Math.round((a + rnd() * (b - a)) / 1000) * 1000;
  put('wallets', { id: 'w_tunai', initial: 150000 }); put('wallets', { id: 'w_bank', name: 'Bank BRI', initial: 1250000 }); put('wallets', { id: 'w_ewallet', name: 'GoPay', initial: 85000 });

  put('budgets', { id: 'b___all', categoryId: '__all', limit: 2000000 }); put('budgets', { id: 'b_e_makan', categoryId: 'e_makan', limit: 750000 }); put('budgets', { id: 'b_e_hiburan', categoryId: 'e_hiburan', limit: 150000 });
  put('goals', { id: 'g_laptop', title: 'Laptop baru', icon: '💻', target: 6000000, deadline: addMonthsClamp(t0, 6) });

function compressImage(file, maxSide, quality) {
  maxSide = maxSide || 1100; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, maxSide / Math.max(w, h)); w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
      const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', quality)); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Gambar tidak bisa dibaca')); };
    img.src = url;
  });
}

const INCOME_HINT = ['terima', 'dapat', 'dapet', 'masuk', 'cair', 'refund', 'dibayar'];
function parseQuick(text) {

  const re = /(?:rp\.?\s*)?(\d{1,3}(?:[.,]\d{3})+|\d+(?:[.,]\d+)?)\s*(juta|jt|ribu|rb|k|perak)?(?![a-z])/g; let m, best = null;

  }

  let catId = ''; let type = 'expense';

  if (custom) { catId = custom.id; type = custom.type; }
  else for (const [id, words] of KW) { if (words.some(w => new RegExp('(^|\\W)' + w.replace(/ /g, '\\s+') + '(\\W|$)').test(t)) && live('categories', id)) { catId = id; type = id.indexOf('i_') === 0 ? 'income' : 'expense'; break; } }
  if (!catId && INCOME_HINT.some(w => t.indexOf(w) >= 0)) { type = 'income'; catId = live('categories', 'i_lain') ? 'i_lain' : ''; }
  out.type = type; if (catId) out.categoryId = catId;
  const ws = wallets(); let wid = (ws.find(w => t.indexOf(w.name.toLowerCase()) >= 0) || {}).id;
  if (!wid) { const kinds = [['cash', ['tunai', 'cash', 'cas']], ['ewallet', ['gopay', 'ovo', 'dana', 'shopeepay', 'linkaja', 'e-wallet', 'ewallet', 'qris']], ['bank', ['bca', 'bri', 'bni', 'mandiri', 'bsi', 'btn', 'bank', 'atm', 'rekening', 'transfer']]];
    for (const [k, words] of kinds) { const hit = words.find(w => t.indexOf(w) >= 0); if (hit) { wid = (ws.find(w => w.kind === k) || {}).id; if (wid) { out.note = out.note.replace(new RegExp('\\b' + hit + '\\b', 'i'), ''); break; } } } }
  else { const wn = ws.find(w => w.id === wid).name; out.note = out.note.replace(new RegExp(wn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), ''); }
  if (wid) out.walletId = wid;
  if (/\bkemarin\b/.test(t)) out.date = addDays(today(), -1);
  out.note = out.note.replace(/\b(kemarin|tadi|hari ini|pakai|pake|via)\b/gi, '').replace(/\s+/g, ' ').trim().slice(0, 120);
  if (out.note) out.note = out.note.charAt(0).toUpperCase() + out.note.slice(1);

}

      incoming.forEach(r => { const list = S.db[c]; const i = list.findIndex(x => x.id === r.id);
        if (r.deleted && mode !== 'replace') return;
        if (mode === 'replace' || i < 0 || list[i].deleted || (r.updatedAt || 0) > (list[i].updatedAt || 0)) { const rec = Object.assign({}, r, { updatedAt: ts }); if (i < 0) list.push(rec); else list[i] = rec; applied++; } });
    });
    const rc = obj.receipts || {}; for (const id of Object.keys(rc)) { try { await Receipts.put(id, rc[id]); } catch (e) {} }
    seedDefaults(); closeAllSheets(); commit(); toast('Backup dipulihkan ✓ (' + applied + ' data)', 'success', 3500);
  };
  $('[data-x=merge]', s.el).onclick = () => run('merge'); $('[data-x=replace]', s.el).onclick = () => run('replace');
});

/* ====================== EKSPOR ====================== */
function pdfSafe(x) { return stripEmoji(x).replace(/→/g, '>').replace(/⇄/g, '<>').replace(/[–—]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[^\x00-\xFF]/g, '').trim(); }
const TYPE_LBL = { expense: 'Pengeluaran', income: 'Pemasukan', transfer: 'Transfer', saving: 'Tabungan', debt: 'Utang/Piutang' };
function exportRows(forPdf) {
  const list = histFiltered(); const clean = forPdf ? pdfSafe : stripEmoji;
  return list.map(t => { const v = txView(t); return { date: t.date, type: TYPE_LBL[t.type] || t.type, desc: clean(v.title), wallet: t.walletId ? clean(wal(t.walletId).name) : '-', to: t.toWalletId ? clean(wal(t.toWalletId).name) : '', amount: (v.sign === '-' ? -1 : 1) * Math.abs(Number(t.amount) || 0), note: t.note || '' }; });
}
function exportName(ext) { return 'FinFlow_' + S.user.username + '_' + periodRange().start.replace('0000-01-01', 'semua') + '_' + today() + '.' + ext; }
function exportCsv() {
  if (previewBlocked()) return;
  const rows = exportRows(); if (!rows.length) return toast('Tidak ada data di periode/filter ini', 'warn');
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [['Tanggal', 'Jenis', 'Keterangan', 'Dompet', 'Ke Dompet', 'Nominal', 'Catatan'].map(q).join(',')].concat(rows.map(r => [r.date, r.type, r.desc, r.wallet, r.to, r.amount, r.note].map(q).join(',')));
  downloadBlob(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), exportName('csv')); toast('CSV diunduh ✓', 'success');
}
async function exportXlsx() {
  if (previewBlocked()) return;
  if (needPremium('Ekspor Excel adalah fitur Premium. Versi gratis bisa ekspor CSV.')) return;
  const rows = exportRows(); if (!rows.length) return toast('Tidak ada data di periode/filter ini', 'warn');
  toast('Menyiapkan file Excel…');
  try { await loadScript(LIB.xlsx); } catch (e) { toast('Excel butuh internet saat pertama dipakai. Diganti CSV (bisa dibuka di Excel/Sheets).', 'warn', 4500); return exportCsv(); }
  const r = periodRange(); const sm = summarize(r);
  const aoa = [['Tanggal', 'Jenis', 'Keterangan', 'Dompet', 'Ke Dompet', 'Nominal (Rp)', 'Catatan']].concat(rows.map(x => [x.date, x.type, x.desc, x.wallet, x.to, x.amount, x.note]));
  const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [{ wch: 11 }, { wch: 14 }, { wch: 30 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 30 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Transaksi');
  const sumAoa = [['Laporan ' + APP.name], ['Nama', displayName()], ['Periode', r.label], [], ['Pemasukan', sm.inc], ['Pengeluaran', sm.exp], ['Selisih', sm.inc - sm.exp], [], ['Kategori pengeluaran', 'Nominal', '%']]
    .concat(Object.keys(sm.byExp).sort((a, b) => sm.byExp[b] - sm.byExp[a]).map(k => [stripEmoji(cat(k).name), sm.byExp[k], sm.exp ? Math.round(sm.byExp[k] / sm.exp * 1000) / 10 : 0]));
  const ws2 = XLSX.utils.aoa_to_sheet(sumAoa); ws2['!cols'] = [{ wch: 24 }, { wch: 16 }, { wch: 8 }]; XLSX.utils.book_append_sheet(wb, ws2, 'Ringkasan');
  XLSX.writeFile(wb, exportName('xlsx')); toast('File Excel diunduh ✓', 'success');
}
async function exportPdf() {
  if (previewBlocked()) return;
  if (needPremium('Laporan PDF adalah fitur Premium. Versi gratis bisa ekspor CSV.')) return;
  const rows = exportRows(true); const r = periodRange(); const sm = summarize(r);
  if (!rows.length) return toast('Tidak ada data di periode/filter ini', 'warn');
  toast('Menyiapkan PDF…');
  try { await loadScript(LIB.jspdf); await loadScript(LIB.autotable); if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('x'); }
  catch (e) { toast('PDF langsung butuh internet. Membuka mode cetak — pilih "Simpan sebagai PDF".', 'warn', 4500); return printReport(rows, r, sm); }
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text('Laporan Keuangan ' + APP.name, 14, 18);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(pdfSafe(displayName()) + ' (@' + S.user.username + ')   |   Periode: ' + pdfSafe(r.label) + '   |   Dicetak: ' + fmtDate(today()), 14, 25);
  doc.autoTable({ startY: 30, head: [['Pemasukan', 'Pengeluaran', 'Selisih', 'Total saldo dompet']], body: [[rp(sm.inc), rp(sm.exp), rp(sm.inc - sm.exp), rp(totalBalance())]], theme: 'grid', headStyles: { fillColor: [79, 70, 229] }, styles: { fontSize: 10 } });
  const catRows = Object.keys(sm.byExp).sort((a, b) => sm.byExp[b] - sm.byExp[a]).map(k => [pdfSafe(cat(k).name), rp(sm.byExp[k]), (sm.exp ? Math.round(sm.byExp[k] / sm.exp * 100) : 0) + '%']);
  if (catRows.length) doc.autoTable({ startY: doc.lastAutoTable.finalY + 6, head: [['Kategori pengeluaran', 'Nominal', '%']], body: catRows, theme: 'striped', headStyles: { fillColor: [13, 148, 136] }, styles: { fontSize: 9 } });
  doc.autoTable({ startY: doc.lastAutoTable.finalY + 6, head: [['Tanggal', 'Jenis', 'Keterangan', 'Dompet', 'Nominal', 'Catatan']], body: rows.map(x => [x.date, x.type, x.desc, x.wallet + (x.to ? ' > ' + x.to : ''), (x.amount < 0 ? '-' : '') + rp(Math.abs(x.amount)), pdfSafe(x.note)]), theme: 'striped', headStyles: { fillColor: [79, 70, 229] }, styles: { fontSize: 8 }, columnStyles: { 4: { halign: 'right' } } });
  const pages = doc.internal.getNumberOfPages(); for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text(APP.name + ' v' + APP.version + ' — hal ' + i + '/' + pages, 14, 290); }
  doc.save(exportName('pdf')); toast('PDF diunduh ✓', 'success');
}
function printReport(rows, r, sm) {
  const tr = a => '<tr>' + a.map(x => '<td>' + esc(x) + '</td>').join('') + '</tr>';
  $('#printArea').innerHTML = '<h2>Laporan Keuangan ' + esc(APP.name) + '</h2><p>' + esc(displayName()) + ' (@' + esc(S.user.username) + ') · Periode: ' + esc(r.label) + ' · Dicetak ' + esc(fmtDate(today())) + '</p>' +
    '<table><tr><th>Pemasukan</th><th>Pengeluaran</th><th>Selisih</th><th>Total saldo</th></tr>' + tr([rp(sm.inc), rp(sm.exp), rp(sm.inc - sm.exp), rp(totalBalance())]) + '</table>' +
    '<table><tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th>Dompet</th><th>Nominal</th><th>Catatan</th></tr>' + rows.map(x => tr([x.date, x.type, x.desc, x.wallet + (x.to ? ' > ' + x.to : ''), (x.amount < 0 ? '-' : '') + rp(Math.abs(x.amount)), x.note])).join('') + '</table>';
  setTimeout(() => { try { window.print(); } catch (e) { toast('Cetak tidak didukung di sini', 'error'); } }, 100);
}

/* ====================== AKSI (event delegation) ====================== */
const ACT = {
  authMode: el => showAuth(el.dataset.mode),
  submitForm: (el, e) => { e.preventDefault(); const f = el.closest('form'); const fn = f && SUBMIT[f.dataset.submit]; if (fn) Promise.resolve(fn(f, e)).catch(err => { console.error(err); toast('Terjadi kesalahan: ' + err.message, 'error'); }); },
  demoRegister: () => { closeAllSheets(); LS.del('ff6_session'); S.user = null; S.db = null; showAuth('register'); },
  pickUser: el => { const i = $('#authScreen [name=username]'); if (i) { i.value = el.dataset.u; const p = $('#authScreen [name=pin]'); if (p) p.focus(); } },
  forgotPin: () => forgotPin(), wipeLocalUser: el => wipeLocalUser(el.dataset.u),
  startDemo: () => { let users = getUsers(); if (!users.demo) createLocalUser('demo', 'Pengguna Demo', '0000', { lockOnOpen: false }); LS.del(dbKey('demo')); Receipts.delUser('demo'); startSession('demo', { newUser: true, demo: true, displayName: 'Pengguna Demo' }); },
  openServer: () => openServer(), key: el => lockKey(el.dataset.k), lockSwitch: () => { if (S.user) saveDb(); LS.del('ff6_session'); S.user = null; S.db = null; showAuth('login'); },
  logout: () => logout(),
  tab: el => { S.tab = el.dataset.tab; closeAllSheets(); renderAll(); window.scrollTo(0, 0); },
  goPlan: el => { closeAllSheets(); S.tab = 'plan'; S.ui.plan = el.dataset.t; renderAll(); window.scrollTo(0, 0); },
  setPeriod: el => { const k = el.dataset.k; if (k === 'custom' && !S.ui.cStart) { S.ui.cStart = monthRange(0).start; S.ui.cEnd = today(); } S.ui.period = { kind: k, offset: 0 }; S.ui.hist.limit = 120; renderAll(); },
  shiftPeriod: el => { S.ui.period.offset = (S.ui.period.offset || 0) + Number(el.dataset.d); renderAll(); },
  toggleHide: () => { const g = setGlobal({ hideMoney: !getGlobal().hideMoney }); applyTheme(); renderTop(); toast(g.hideMoney ? 'Nominal disembunyikan' : 'Nominal ditampilkan'); },
  syncNow: () => syncNow(true), openSettings: () => openSettings(), editProfile: () => editProfile(), changePin: () => changePin(),
  manageWallets: () => manageWallets(), manageCats: () => manageCats(), wipeData: () => wipeData(),
  editWallet: el => editWallet({ id: el.dataset.id, from: el.dataset.from }),
  editCat: el => editCat({ id: el.dataset.id, type: el.dataset.type, from: el.dataset.from }),
  pickEmo: el => { const t = topSheet(); if (t && t.pickEmo) t.pickEmo(el.dataset.e); },
  pickW: el => { const t = topSheet(); if (t && t.pickW) t.pickW(el.dataset.id); },
  pickRCat: el => { const t = topSheet(); if (t && t.pickRCat) t.pickRCat(el.dataset.id); },
  walletHistory: el => { S.tab = 'history'; S.ui.hist = Object.assign(S.ui.hist, { wallet: el.dataset.id, cat: '', type: 'all', q: '' }); renderAll(); window.scrollTo(0, 0); },
  catHistory: el => { S.tab = 'history'; S.ui.hist = Object.assign(S.ui.hist, { cat: el.dataset.id, wallet: '', type: 'all', q: '' }); renderAll(); window.scrollTo(0, 0); },
  newTx: el => openTxSheet({ type: el.dataset.type }), openTx: el => openTxSheet({ id: el.dataset.id }),
  txType: el => { readTxInputs(); const t = el.dataset.t; if (t === TX.type) return; TX.type = t;
    if (t !== 'transfer') { const c = live('categories', TX.categoryId); if (!c || c.type !== t) TX.categoryId = (cats(t)[0] || {}).id; }
    else if (!TX.toWalletId || TX.toWalletId === TX.walletId) TX.toWalletId = (wallets().find(w => w.id !== TX.walletId) || {}).id || '';
    renderTxSheet(); },
  txCat: el => { readTxInputs(); TX.categoryId = el.dataset.id; renderTxSheet(); },
  txWallet: el => { readTxInputs(); TX.walletId = el.dataset.id; if (TX.type === 'transfer' && TX.toWalletId === TX.walletId) TX.toWalletId = (wallets().find(w => w.id !== TX.walletId) || {}).id || ''; renderTxSheet(); },
  txTo: el => { readTxInputs(); TX.toWalletId = el.dataset.id; renderTxSheet(); },
  txDate: el => { const i = $('[name=date]', txEntry.el); if (i) i.value = addDays(today(), Number(el.dataset.d)); readTxInputs(); updateBudgetHint(); },
  quickAdd: el => { const i = $('[name=amount]', txEntry.el); const v = Number(el.dataset.v); const n = v ? parseAmount(i.value) + v : 0; i.value = n ? fmtNum(n) : ''; readTxInputs(); updateBudgetHint(); if (!v) i.focus(); },
  txSave: () => saveTx(), txDelete: () => deleteTx(TX.id),
  txDuplicate: () => { readTxInputs(); TX.id = null; TX.date = today(); TX.hasReceipt = false; TX.receipt = null; TX.recurringId = ''; renderTxSheet(); toast('Salinan dibuat — ubah lalu Simpan'); },
  pickReceipt: () => { if (needPremium('Foto struk adalah fitur Premium.')) return; $('#receiptInput').click(); }, dropReceipt: () => { readTxInputs(); TX.receipt = null; TX.removeReceipt = true; renderTxSheet(); },
  viewReceipt: el => viewReceipt(el.dataset.id),
  quickParseBtn: () => {}, voice: () => startVoice(),
  statsType: el => { S.ui.statsType = el.dataset.t; renderAll(); },
  planTab: el => { S.ui.plan = el.dataset.t; renderAll(); },
  editBudget: el => editBudget(el.dataset.cat), editGoal: el => editGoal(el.dataset.id), goalMove: el => goalMove(el.dataset.id, el.dataset.mode),
  editDebt: el => editDebt(el.dataset.id), debtDetail: el => debtDetail(el.dataset.id), debtFilter: el => { S.ui.debtFilter = el.dataset.f; renderAll(); },
  editRecurring: el => editRecurring(el.dataset.id),
  histType: el => { S.ui.hist.type = el.dataset.t; S.ui.hist.limit = 120; renderAll(); },
  histMore: () => { S.ui.hist.limit += 200; $('#histList').innerHTML = histListHtml(); },
  doBackup: () => doBackup(), pickRestore: () => $('#restoreInput').click(),
  exportPdf: () => exportPdf(), exportXlsx: () => exportXlsx(), exportCsv: () => exportCsv(),
  installApp: () => installApp(), openPremium: () => openPremium()
};
const SUBMIT = { doLogin: doLogin, doRegister: doRegister, quickParse: quickParse, noop: () => {} };
const CHANGE = {
  cStart: el => { S.ui.cStart = el.value; renderAll(); }, cEnd: el => { S.ui.cEnd = el.value; renderAll(); },
  histCat: el => { S.ui.hist.cat = el.value; S.ui.hist.limit = 120; $('#histList').innerHTML = histListHtml(); },
  histWallet: el => { S.ui.hist.wallet = el.value; S.ui.hist.limit = 120; $('#histList').innerHTML = histListHtml(); },
  theme: el => { setGlobal({ theme: el.value }); applyTheme(); },
  hideMoney: el => { setGlobal({ hideMoney: el.checked }); applyTheme(); renderTop(); },
  monthStart: el => { put('prefs', { id: 'profile', monthStartDay: Number(el.value) || 1 }); commit(); toast('Bulan sekarang dimulai tanggal ' + el.value, 'success'); },
  lockOnOpen: el => { updateLocalUser(S.user.username, { lockOnOpen: el.checked }); toast(el.checked ? 'PIN diminta saat membuka aplikasi' : 'Aplikasi langsung terbuka tanpa PIN', 'success'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  try { fn(el, e); } catch (err) { console.error(err); toast('Terjadi kesalahan: ' + err.message, 'error'); }
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset || !f.dataset.submit) return; e.preventDefault();
  const fn = SUBMIT[f.dataset.submit]; if (fn) Promise.resolve(fn(f, e)).catch(err => { console.error(err); toast('Terjadi kesalahan: ' + err.message, 'error'); });
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.change && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e); });
let histQTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('money')) {
    const pos = el.value.length - el.selectionStart; const n = parseAmount(el.value); el.value = n ? fmtNum(n) : '';
    try { const p = Math.max(0, el.value.length - pos); el.setSelectionRange(p, p); } catch (x) {}
    if (TX && txEntry && el.name === 'amount') { TX.amount = n; updateBudgetHint(); }
  }
  if (el.dataset && el.dataset.input === 'histQ') { S.ui.hist.q = el.value; clearTimeout(histQTimer); histQTimer = setTimeout(() => { const b = $('#histList'); if (b) b.innerHTML = histListHtml(); }, 150); }
});
window.addEventListener('pagehide', () => { if (S.user) saveDb(); });
window.addEventListener('error', e => { console.error(e.error || e.message); });


/* ====================== APLIKASI (PWA: bisa dipasang & jalan offline) ====================== */
let installEvt = null;
const IS_STANDALONE = (() => { try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } })();
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_WEB = /^https?:$/.test(location.protocol) && !APP.preview && !IS_GAS;
function setupPwa() {
  if (!IS_WEB) return;
  const add = (rel, href) => { if ($('link[rel="' + rel + '"]')) return; const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  add('manifest', 'manifest.webmanifest'); add('apple-touch-icon', 'icons/apple-touch-icon.png');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; updateInstallSlot(); });
window.addEventListener('appinstalled', () => { installEvt = null; updateInstallSlot(); toast('FinFlow sudah terpasang di HP ✓', 'success'); });
function canInstall() { return IS_WEB && !IS_STANDALONE && (!!installEvt || IS_IOS); }
function updateInstallSlot() { const el = $('#installSlot'); if (el) el.innerHTML = canInstall() ? '<button type="button" class="btn block green" data-act="installApp">📲 Pasang FinFlow di HP</button>' : ''; }
async function installApp() {
  if (installEvt) { const ev = installEvt; installEvt = null; ev.prompt(); try { await ev.userChoice; } catch (e) {} updateInstallSlot(); return; }
  if (IS_IOS) return openSheet({ title: 'Pasang di iPhone / iPad', body: '<ol class="small" style="padding-left:18px;margin:0;line-height:1.7"><li>Buka halaman ini di <b>Safari</b>.</li><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas).</li><li>Pilih <b>Tambah ke Layar Utama</b>, lalu <b>Tambah</b>.</li></ol><p class="hint">Ikon FinFlow muncul di layar utama dan bisa dibuka tanpa internet.</p>' });
  toast('Buka menu ⋮ di Chrome, lalu pilih "Instal aplikasi" atau "Tambahkan ke layar utama".', 'warn', 5000);
}
function handleShortcut() {
  if (S.shortcutDone) return; S.shortcutDone = true; let a = '';
  try { a = new URLSearchParams(location.search).get('aksi') || ''; } catch (e) {}
  const map = { keluar: 'expense', masuk: 'income', transfer: 'transfer' };
  if (map[a]) { try { history.replaceState(null, '', location.pathname); } catch (e) {} setTimeout(() => openTxSheet({ type: map[a] }), 150); }
}

/* ====================== MULAI ====================== */
function boot() {
  applyTheme(); setupPwa();
  try { migrateLegacy(); } catch (e) { console.warn(e); }
  const sess = LS.get('ff6_session'); const users = getUsers();
  if (sess && users[sess]) { const u = users[sess]; if (sess !== 'demo' && u.lockOnOpen !== false && u.pinNumeric) showLock(sess); else startSession(sess); }
  else if (APP.preview) ACT.startDemo();
  else showAuth('login');
}
boot();
